version: '3.8'

services:
  # ─── Application ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: paxmedia-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - paxmedia
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=paxmedia
      - DB_USERNAME=paxmedia
      - DB_PASSWORD=paxmedia_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis

  # ─── Web Server ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: paxmedia-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - paxmedia
    depends_on:
      - app

  # ─── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: paxmedia-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paxmedia
      POSTGRES_USER: paxmedia
      POSTGRES_PASSWORD: paxmedia_secret
    networks:
      - paxmedia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paxmedia -d paxmedia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: paxmedia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - paxmedia
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Queue Worker ───────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: paxmedia-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - paxmedia
    depends_on:
      - db
      - redis

  # ─── Scheduler ──────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: paxmedia-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - paxmedia
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  paxmedia:
    driver: bridge
