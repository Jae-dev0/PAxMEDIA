version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: paxmedia-app-dev
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "9000:9000"
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - paxmedia-dev
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=paxmedia
      - DB_USERNAME=paxmedia
      - DB_PASSWORD=paxmedia_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  nginx:
    image: nginx:alpine
    container_name: paxmedia-nginx-dev
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - paxmedia-dev
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: paxmedia-db-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paxmedia
      POSTGRES_USER: paxmedia
      POSTGRES_PASSWORD: paxmedia_secret
    networks:
      - paxmedia-dev

  redis:
    image: redis:7-alpine
    container_name: paxmedia-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - paxmedia-dev

volumes:
  postgres_data:
  redis_data:

networks:
  paxmedia-dev:
    driver: bridge
